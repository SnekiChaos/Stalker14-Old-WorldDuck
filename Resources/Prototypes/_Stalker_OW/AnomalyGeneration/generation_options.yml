# For every anomaly, it sums up the weights and rolls a random number across that total
# Repeats up until totalCount
# 0.1 Sparse
# 1 - Rare
# 2 - Uncommon
# 3 - Base-line
# 4 - Widespread
# 5 - Very prevalent

# Cordon
- type: stAnomalyGenerationOptions
  id: STCordonGenerationOptions
  options:
    totalCount: 300 # Originally 80 on ST14 EN
    anomalyEntries:
      # Electrical
      - protoId: ZoneAnomalyElectra
        weight: 3
      
      # Gravity
      - protoId: ZoneAnomalyVortex
        weight: 1
      - protoId: ZoneAnomalyBurden
        weight: 3
      - protoId: ZoneAnomalyGravi
        weight: 4
      - protoId: ZoneAnomalySpringboard
        weight: 5
      - protoId: ZoneAnomalyGlassShards
        weight: 1
      
      # Thermal
      - protoId: ZoneAnomalyJarka # Burner
        weight: 3
      
      # Psy
      - protoId: ZoneAnomalyLamp
        weight: 1
      
      # Special
      - protoId: ZoneAnomalyBeer
        weight: 0.1


