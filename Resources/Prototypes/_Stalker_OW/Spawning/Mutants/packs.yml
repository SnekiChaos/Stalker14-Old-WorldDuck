# ST:OW - Expanded upon eventually? Idk not really used a ton atm.
# Also uses STPackSpawner instead of SpawnOnApproach
- type: entity
  name: bear family spawner (100%)
  id: BearFamilyPackTrigger100
  parent: MarkerBase
  suffix: ST, T3
  components:
    - type: STPackSpawner
      protoId: STBearFamilyPack
      chance: 1.0
      cooldown: 3600
    - type: ApproachTrigger
    - type: Sprite
      layers:
        - state: blue
        - sprite: Mobs/Aliens/Xenos/burrower.rsi
          state: crit
        - state: ai

