# For da Renegades
# Used to mix up spawns in Swamp to avoid spamming too many fleshes

# T1
- type: entity
  id: MutantSpawnerSwampT1Base
  parent: MutantSpawnerBase
  abstract: true
  suffix: ST:OW, Mixed, Swamp, T1
  components:
    - type: SpawnOnApproach
      prototypes:
        - MobMutantBoar
        - MobMutantFleshAggressive
        - MobMutantCat
        - MobMutantSeer
      restricted:
        - MobMutantBoar
        - MobMutantFleshAggressive
        - MobMutantCat
        - MobMutantSeer


- type: entity
  id: MutantSpawnerSwampT1_1to3_25
  parent: MutantSpawnerSwampT1Base
  name: swamp mutants spawner T1 (1-3, 25%)
  components:
    - type: SpawnOnApproach
      minAmount: 1
      maxAmount: 3
      chance: 0.25


- type: entity
  id: MutantSpawnerSwampT1_1to3_50
