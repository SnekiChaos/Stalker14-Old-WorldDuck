# Controllers

- type: entity
  id: MutantSpawnerControllerBase
  parent: MutantSpawnerBase
  abstract: true
  suffix: ST:OW, T3, Controller
  components:
    - type: SpawnOnApproach
      prototypes:
        - STMutantController
      restricted:
        - STMutantController

