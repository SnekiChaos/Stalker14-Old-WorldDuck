# Meat & jerky stacks - max 3
- type: stack
  abstract: true
  id: STOWBaseMeatStack
  maxCount: 3

# Raw meat
- type: stack
  parent: STOWBaseMeatStack
  id: STOWDogMeatStack
  name: stack-st-food-meat-dog
  spawn: FoodMeatDog

- type: stack
  parent: STOWBaseMeatStack
  id: STOWRatMeatStack
  name: stack-st-food-meat-rat
  spawn: FoodMeatSTRatRaw

# Cooked meat
- type: stack
  parent: STOWBaseMeatStack
