# Sphere Helmets

- type: entity
  abstract: true
  parent: STClothingHeadBase
  id: STOWClothingHeadHelmetT3PVPAltBase # OW Changed ID
  suffix: STOW, T3, PVP
  components:
    - type: Craftable
    - type: STWeight
      self: 2.1
    - type: Armor
      armorClass: 3
      modifiers:
        coefficients:
          Blunt: 0.80
          Slash: 0.85
          Piercing: 0.75
    - type: ExplosionResistance
      damageCoefficient: 0.95
    - type: HideLayerClothing
      slots:
        - Hair
        - HeadTop

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltMilitary # OW Begin - Changed IDs from T3Sphere to T3PVPAlt
  name: Military Sphere-08
  description: A helmet for lucky soldiers and veterans, designed to protect against stabbing attacks. It’s a helmet from the 'Beryl-5M' series.
  components:
    - type: Sprite
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_military.rsi
      layers:
        - state: icon
        - state: light-icon
          shader: unshaded
          visible: false
          map: [ "light" ]
    - type: Clothing
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_military.rsi
      equippedPrefix: off
    - type: Item
      heldPrefix: off
    - type: ItemTogglePointLight
    - type: PointLight
      enabled: false
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      radius: 8
      netsync: false
    - type: Appearance
    - type: HandheldLight
      addPrefix: false
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
    - type: LightBehaviour
      behaviours:
        - !type:FadeBehaviour
          id: radiating
          interpolate: Linear
          maxDuration: 2.0
          startValue: 3.0
          endValue: 2.0
          isLooped: true
          reverseWhenFinished: true
        - !type:PulseBehaviour
          id: blinking
          interpolate: Nearest
          maxDuration: 1.0
          startValue: 0.1
          endValue: 2.0
          isLooped: true
    - type: ToggleableVisuals
      spriteLayer: light
      clothingVisuals:
        head:
          - state: on-equipped-HELMET
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellHyper
    - type: Craftable

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltDuty
  name: Duty Sphere-08
  description: This model is a modification of the Sphere-08 army helmet, made for the Duty faction. It provides Class 3 protection, capable of withstanding blunt impacts, shrapnel, and, to some extent, bullets of penetration classes 1 and 2. A reliable helmet at a fair price.
  components:
    - type: Sprite
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_dolg.rsi
    - type: Clothing
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_dolg.rsi

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltFreedom
  name: Freedom Sphere-08
  description: This model is a modification of the Sphere-08 army helmet, for the Freedom group. It provides class 3 protection, able to withstand blunt impacts, shrapnel, and to some extent, class 1 and 2 penetration bullets. A reliable helmet at a decent price.
  components:
    - type: Sprite
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_svoboda.rsi # Stalker EN change - gave it a new sprite and made it obtainable.
    - type: Clothing
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_svoboda.rsi # Stalker EN change - gave it a new sprite and made it obtainable.

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltMaskBase # OW Begin - Changed IDs from Spheremask to PVPAltMask
  components:
