- type: entity
  parent: BaseArrow
  id: STBroadheadBolt
  name: Broadhead Bolt
  suffix: ST:OW
  description: A hefty bolt that digs through even the toughest of hides.
  components:
    - type: Tag
      tags:
        - Arrow
    - type: Sprite
      layers:
        - state: tail
          color: firebrick
        - state: rod
          color: saddlebrown
        - state: tip
          color: dimgray
    - type: Projectile
      deleteOnCollide: false
      onlyCollideWhenShot: true
      projectileClass: 2
      damage:
        types:
          Slash: 35
          Mutant: 150
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
      embedOnThrow: false
    - type: Ammo
      muzzleFlash: null
    - type: BoltBallistics
      speedMultiplier: 1 # Normal speed
      maxFlightTime: 0.8 # 800 milliseconds
    - type: BoltBreakOnImpact
      breakChance: 0.5 # 5%
      brokenPrototype: STBrokenBolt
    - type: RepositoryItem
      categoryName: repository-magazines-category

- type: entity
  parent: BaseArrow
  id: STBodkinBolt
  name: Bodkin Bolt
  suffix: ST:OW
  description: A bolt with a razor-like edge that spears through most ballistic armors like paper.
  components:
    - type: Tag
      tags:
        - Arrow
    - type: Sprite
      layers:
        - state: tail
          color: indigo
        - state: rod
          color: peru
        - state: tip
          color: gray
    - type: Projectile
      deleteOnCollide: false
      onlyCollideWhenShot: true
      projectileClass: 3
      damage:
        types:
          Piercing: 50
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
      embedOnThrow: false
    - type: Ammo
      muzzleFlash: null
    - type: BoltBallistics
      speedMultiplier: 1.15 # Slightly faster than normal
      maxFlightTime: 0.8 # 800 milliseconds
    - type: BoltBreakOnImpact
      breakChance: 0.5 # 5%
      brokenPrototype: STBrokenBoltAP
    - type: RepositoryItem
      categoryName: repository-magazines-category