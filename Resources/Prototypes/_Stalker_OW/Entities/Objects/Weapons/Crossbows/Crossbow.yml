- type: entity
  parent: BowImprovised
  id: STweaponCrossbow
  name: crossbow
  suffix: ST:OW
  description: It's heavy, clunky, and leaves oily residues on your palms, but it'll shred through mutants and people without a hitch.
  components:
    - type: RepositoryItem
      categoryName: repository-weapons-category
      
    - type: Clothing
      sprite: _Stalker_OW/Objects/Weapons/Guns/Crossbow

    - type: Item
      sprite: _Stalker_OW/Objects/Weapons/Guns/Crossbow

    - type: Sprite
      sprite: _Stalker_OW/Objects/Weapons/Guns/Crossbow

    - type: STWeaponModuleContainer

    - type: STWeight
      self: 5

    - type: ItemSlots
      slots:
        gun_module_scope:
          name: Scope
          priority: 1
          whitelist:
            tags:
              - STWeaponModuleSniperSight

        projectiles:
          name: Projectiles
          priority: 2
          insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
          whitelist:
            tags:
              - Arrow
              - Plunger

    - type: ContainerContainer
      containers:
        gun_module_scope: !type:ContainerSlot {}
        projectiles: !type:ContainerSlot {}

    - type: STWeaponModule
      effect:
        soundGunshotVolumeAddition: -16
        farshotSoundDecrease: 0.8