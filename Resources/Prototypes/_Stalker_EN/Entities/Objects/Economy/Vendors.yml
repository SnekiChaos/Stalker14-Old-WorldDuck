# OKSOP Enlisted - Restock on RU's Vendor File

- type: entity
  parent: VendingMachine
  id: VendingMachineBoxesPSZMilitaryEN
  name: OKSOP Kit Warehouse
  description: Army Supply Depot with OKSOP kits inside.
  suffix: Stalker, EN
  components:
  - type: VendingMachine
    ejectDelay: 0.1
    pack: MilitaryPSZInventoryEN
    dispenseOnHitChance: 0.0
    dispenseOnHitThreshold: 2
    offState: off
    brokenState: broken
    autoEquipDispensed: true # ST:OW
  - type: Sprite
    sprite: _Stalker/Objects/Decoration/military_lot_of_boxes.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.05,-0.15,1,0.65"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: AccessReader
    access: [["Military"]]
  - type: AmbientSound
    range: 0
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 0

- type: vendingMachineInventory
  id: MilitaryPSZInventoryEN
  #startingInventory:
  #OKSOPMP153Crate: 8 #T2 Enlisted - (Amount of Enlisted x 2)
  #OKSOPSKSCrate: 4 #T2 senior privates (amount of senior privates x 4)
  #OKSOPAK74uCrate: 8 # T2 Enlisted - (Amount of Enlisted x 2)
  #OKSOPCombatMedCrate: 6 # T2 Enlisted - (Amount of Enlisted x 3)
  #OKSOPAK74Crate: 4 # T2 Sergeant - (Amount of SGT x 4)
  #OKSOPMosinCrate: 2 #T2 Sergeant - (Amount of SGT x 2)
  #ArmyProvisionCrate: 6
  #ArmyMedkitMilitaryCrate: 6
  #Army545Mag30Crate: 6
  #Army545FMJCrate: 6
  #Army6mmbuckshotCrate: 6

  # ST:OW begin
  categoryGroups:
    - category: armor
      entries:
        ClothingHeadHelmetSH68: 30
        STOWClothingOuterArmorT2VestMilitary: 30
        
    - category: weapons
      entries:
        STWeaponRifleAKS74: 30
        STWeaponRifleAK74M: 10
        STWeaponSniperMosin: 10
        STWeaponSniperSKS: 10
        STWeaponShotgunMP153: 30 # For gun confiscation replacements!
        WeaponPistolGSH18: 30
        RGD5Grenade: 20
        STCombatKnife: 30

    - category: magazines
      entries:
        545Mag30: 50
        BaseGSH-18Mag10: 30

    - category: ammo
      entries:
        545FMJBox: 50
        739FMJBox: 25
        754FMJBox: 25
        919PSTBox: 25
        919RIPBox: 25
        6mmBuckshotBox: 30

    - category: medicine
      entries:
          MedkitAI2: 30
          MedkitMilitary: 20
          MedkitScience: 20

    - category: storage
      entries:
        ClothingBeltGreenWebbingStalker: 30
        ClothingBeltBandolierStalker: 30
        ClothingBackpackTacticOliveStalker: 30

    - category: utility
      entries:
        DrinkMREFlask: 50
        FoodTinMRE: 50
        Binocularus1: 50
        Zipties: 50
        STFlashlightSeclite: 50
        PowerCellHyper: 50
        STBoltBagFilled: 50
        BaseRadio: 50
        STRadioHeadset: 50
        STModuleSilencerSniperT1: 10
        STModuleSniperSightT1: 10
        ClothingHeatBagStalker: 50

    - category: clothing
      entries:
        ClothingMaskGasM40Military: 30
        ClothingHeadHatMilitary: 30
        ClothingBandageStalkerKrest: 30
        ClothingHeadHatBeretBrigmedic: 30
  # ST:OW end

